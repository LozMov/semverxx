name: Test

on:
  push:
    branches: [ master ]
    paths: [ '**.cpp', '**.h', 'CMakeLists.txt', '.github/workflows/*' ]
  pull_request:
    branches: [ master ]
    paths: [ '**.cpp', '**.h', 'CMakeLists.txt', '.github/workflows/*' ]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        std: [ 14, 17, 20, 23 ]
        compiler: [ g++-12, clang++-15 ]

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_CXX_STANDARD=${{ matrix.std }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Test
        run: ctest --test-dir build --build-config ${{env.BUILD_TYPE}} --parallel --output-on-failure